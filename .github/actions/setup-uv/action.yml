name: Setup uv with retries
description: Set up uv with up to ten attempts.
inputs:
  version:
    description: uv version to install.
    required: true
runs:
  using: composite
  steps:
    - id: attempt-1
      continue-on-error: true
      uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
      with:
        version: ${{ inputs.version }}
    - if: steps.attempt-1.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-2
      if: steps.attempt-1.outcome == 'failure'
      continue-on-error: true
      uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
      with:
        version: ${{ inputs.version }}
    - if: steps.attempt-2.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-3
      if: steps.attempt-2.outcome == 'failure'
      continue-on-error: true
      uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
      with:
        version: ${{ inputs.version }}
    - if: steps.attempt-3.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-4
      if: steps.attempt-3.outcome == 'failure'
      continue-on-error: true
      uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
      with:
        version: ${{ inputs.version }}
    - if: steps.attempt-4.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-5
      if: steps.attempt-4.outcome == 'failure'
      continue-on-error: true
      uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
      with:
        version: ${{ inputs.version }}
    - if: steps.attempt-5.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-6
      if: steps.attempt-5.outcome == 'failure'
      continue-on-error: true
      uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
      with:
        version: ${{ inputs.version }}
    - if: steps.attempt-6.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-7
      if: steps.attempt-6.outcome == 'failure'
      continue-on-error: true
      uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
      with:
        version: ${{ inputs.version }}
    - if: steps.attempt-7.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-8
      if: steps.attempt-7.outcome == 'failure'
      continue-on-error: true
      uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
      with:
        version: ${{ inputs.version }}
    - if: steps.attempt-8.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-9
      if: steps.attempt-8.outcome == 'failure'
      continue-on-error: true
      uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
      with:
        version: ${{ inputs.version }}
    - if: steps.attempt-9.outcome == 'failure'
      shell: bash
      run: sleep 2
    - if: steps.attempt-9.outcome == 'failure'
      uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
      with:
        version: ${{ inputs.version }}
