name: Setup Rust with retries
description: Set up Rust with up to ten attempts.
inputs:
  toolchain:
    description: Rust toolchain to install.
    required: true
  targets:
    description: Additional Rust targets to install.
    required: false
runs:
  using: composite
  steps:
    - id: attempt-1
      continue-on-error: true
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
    - if: steps.attempt-1.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-2
      if: steps.attempt-1.outcome == 'failure'
      continue-on-error: true
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
    - if: steps.attempt-2.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-3
      if: steps.attempt-2.outcome == 'failure'
      continue-on-error: true
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
    - if: steps.attempt-3.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-4
      if: steps.attempt-3.outcome == 'failure'
      continue-on-error: true
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
    - if: steps.attempt-4.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-5
      if: steps.attempt-4.outcome == 'failure'
      continue-on-error: true
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
    - if: steps.attempt-5.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-6
      if: steps.attempt-5.outcome == 'failure'
      continue-on-error: true
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
    - if: steps.attempt-6.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-7
      if: steps.attempt-6.outcome == 'failure'
      continue-on-error: true
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
    - if: steps.attempt-7.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-8
      if: steps.attempt-7.outcome == 'failure'
      continue-on-error: true
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
    - if: steps.attempt-8.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-9
      if: steps.attempt-8.outcome == 'failure'
      continue-on-error: true
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
    - if: steps.attempt-9.outcome == 'failure'
      shell: bash
      run: sleep 2
    - if: steps.attempt-9.outcome == 'failure'
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
