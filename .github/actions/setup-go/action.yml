name: Setup Go with retries
description: Set up Go with up to ten attempts.
inputs:
  go-version:
    description: Go version to install.
    required: true
  cache:
    description: Whether to enable the Go build cache.
    default: 'false'
runs:
  using: composite
  steps:
    - id: attempt-1
      continue-on-error: true
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache }}
    - if: steps.attempt-1.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-2
      if: steps.attempt-1.outcome == 'failure'
      continue-on-error: true
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache }}
    - if: steps.attempt-2.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-3
      if: steps.attempt-2.outcome == 'failure'
      continue-on-error: true
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache }}
    - if: steps.attempt-3.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-4
      if: steps.attempt-3.outcome == 'failure'
      continue-on-error: true
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache }}
    - if: steps.attempt-4.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-5
      if: steps.attempt-4.outcome == 'failure'
      continue-on-error: true
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache }}
    - if: steps.attempt-5.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-6
      if: steps.attempt-5.outcome == 'failure'
      continue-on-error: true
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache }}
    - if: steps.attempt-6.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-7
      if: steps.attempt-6.outcome == 'failure'
      continue-on-error: true
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache }}
    - if: steps.attempt-7.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-8
      if: steps.attempt-7.outcome == 'failure'
      continue-on-error: true
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache }}
    - if: steps.attempt-8.outcome == 'failure'
      shell: bash
      run: sleep 2
    - id: attempt-9
      if: steps.attempt-8.outcome == 'failure'
      continue-on-error: true
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache }}
    - if: steps.attempt-9.outcome == 'failure'
      shell: bash
      run: sleep 2
    - if: steps.attempt-9.outcome == 'failure'
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache }}
