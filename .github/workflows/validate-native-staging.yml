name: Validate Native Staging

on:
  pull_request:
    paths:
      - 'packages/cli/package.json'
      - 'packages/cli/src/vc.js'
      - 'packages/cli/scripts/build-binary.mjs'
      - 'packages/vc-native/**'
      - 'utils/sync-native-optional-deps.js'
      - '.github/workflows/validate-native-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_REMOTE_ONLY: 'true'
  TURBO_TEAM: 'vercel'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

concurrency:
  group: validate-native-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage-and-verify:
    name: Stage + verify native package
    runs-on: ubuntu-latest-32-core-oss
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@a75363d06101555fc97c6c7e1e65670b99104d98 # 1.96.1
        with:
          toolchain: stable
          targets: wasm32-wasip2

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: 'pyproject.toml'

      - name: Install uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          enable-cache: false

      - name: Install pnpm
        run: npm i -g pnpm@10.29.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build custom Node runtime
        env:
          VERCEL_CLI_NODE_VERSION: 24.14.1
          VERCEL_CLI_NODE_PLATFORM: linux
          VERCEL_CLI_NODE_ARCH: x64
        run: pnpm turbo --no-update-notifier --root-turbo-json turbo.node-runtime.json run //#build-binary-node --output-logs=new-only

      - name: Build workspace packages
        run: pnpm build
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Build binary
        working-directory: packages/cli
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VERCEL_CLI_BINARY_NODE_PATH: .node-runtime/node-v24.14.1-linux-x64-small-icu/bin/node
        run: node scripts/build-binary.mjs --target node24.14.1-linux-x64 --compress Brotli --output ./dist-bin/vercel-linux-x64

      - name: Smoke test binary
        working-directory: packages/cli
        run: |
          set -euo pipefail
          chmod +x dist-bin/vercel-linux-x64
          node scripts/smoke-test-binary.mjs dist-bin/vercel-linux-x64

      - name: Stage native packages
        run: node packages/vc-native/scripts/stage-packages.mjs --allow-missing

      - name: Verify staged package layout
        run: |
          set -euo pipefail
          dir="packages/vc-native/dist-native/vc-native-linux-x64"
          test -f "$dir/package.json"
          test -x "$dir/bin/vercel"
          # Confirm the staged package.json has os/cpu filtering
          node -e "
            const pkg = require('./$dir/package.json');
            if (pkg.name !== '@vercel/vc-native-linux-x64') throw new Error('wrong name: ' + pkg.name);
            if (pkg.os[0] !== 'linux') throw new Error('wrong os: ' + pkg.os);
            if (pkg.cpu[0] !== 'x64') throw new Error('wrong cpu: ' + pkg.cpu);
            if (pkg.version !== require('./packages/cli/package.json').version) throw new Error('version mismatch');
            console.log('staged package OK:', pkg.name + '@' + pkg.version);
          "

      - name: Verify trampoline resolves and spawns staged native
        working-directory: packages/cli
        run: |
          set -euo pipefail
          # Build a production-like install layout: vercel/dist/vc.js + the
          # staged native as a sibling in node_modules, then spawn the real
          # trampoline and confirm it execs the native binary.
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/node_modules/vercel/dist" \
                   "$tmp/node_modules/@vercel/vc-native-linux-x64"
          cp dist/vc.js "$tmp/node_modules/vercel/dist/vc.js"
          cp dist/version.mjs "$tmp/node_modules/vercel/dist/version.mjs"
          cp -r ../../packages/vc-native/dist-native/vc-native-linux-x64/* \
                "$tmp/node_modules/@vercel/vc-native-linux-x64/"
          # The trampoline should spawn the native and exit with its code.
          out=$(node "$tmp/node_modules/vercel/dist/vc.js" --version 2>&1)
          echo "$out"
          # Version-agnostic: read the CLI version from package.json instead of
          # hardcoding it, so this check survives version bumps.
          expected="$(node -p "require('./package.json').version")"
          echo "$out" | grep -q "^${expected}$" || {
            echo "::error::trampoline did not print version '$expected' from native"
            exit 1
          }
          echo "trampoline spawned native OK"
          rm -rf "$tmp"

      - name: Verify sync-native-optional-deps is a no-op at current version
        run: |
          node utils/sync-native-optional-deps.js
          # Confirm git has no unstaged changes to package.json from the sync
          git diff --exit-code packages/cli/package.json || {
            echo "::error::sync-native-optional-deps.js modified package.json unexpectedly"
            exit 1
          }

      - name: Upload staged native package
        uses: actions/upload-artifact@v4
        with:
          name: staged-vc-native-linux-x64
          path: packages/vc-native/dist-native/vc-native-linux-x64/
          retention-days: 3
          if-no-files-found: error
