name: Nightly Tests (No Turbo Cache)

# Temporary workflow while we investigate turborepo cache key issues.
# Runs the full test suite (all packages, unit + e2e) with the turbo
# cache fully disabled (TURBO_FORCE, no remote cache setup), so results
# reflect real test execution rather than cache hits.
#
# Alerts by opening (or updating) a GitHub issue when the run fails.
on:
  workflow_dispatch:
  schedule:
    # 1am Pacific. 08:00 UTC == 1am PDT; during PST (winter) this runs
    # at midnight Pacific. Close enough for a nightly job.
    - cron: '0 8 * * *'

permissions:
  contents: read

env:
  VERCEL_TELEMETRY_DISABLED: '1'
  # Force turbo to ignore all caches (local and remote) for every task.
  TURBO_FORCE: 'true'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  setup:
    name: Resolve Nightly Context
    runs-on: ubuntu-latest
    outputs:
      headSha: ${{ steps.context.outputs.headSha }}
    steps:
      - name: Resolve commit
        id: context
        run: echo "headSha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  unit-test:
    name: Unit / ${{ matrix.label }}
    needs: setup
    timeout-minutes: 120
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            nodeVersion: 20
            concurrency: 2
            label: linux/node20
          - runner: ubuntu-latest
            nodeVersion: 22
            concurrency: 2
            label: linux/node22
          - runner: macos-14
            nodeVersion: 20
            concurrency: 2
            label: mac/node20
          - runner: macos-14
            nodeVersion: 22
            concurrency: 2
            label: mac/node22
          - runner: windows-latest
            nodeVersion: 22
            concurrency: 1
            label: win/node22
    env:
      TURBO_TEST_PLATFORM: ${{ matrix.runner }}-node${{ matrix.nodeVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.headSha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodeVersion }}
      - name: install turbo@2.10.8
        run: npm i -g turbo@2.10.8
      - name: Select full nightly lane
        id: affected
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Setup Go toolchain
        if: steps.affected.outputs.run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.12'
          cache: false
      - name: Setup Rust toolchain
        if: steps.affected.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.96.1'
          targets: wasm32-wasip2
      # yarn 1.22.21 introduced a Corepack bug when running tests.
      # this can be removed once https://github.com/yarnpkg/yarn/issues/9015 is resolved
      - name: install yarn@1.22.19
        if: steps.affected.outputs.run == 'true'
        run: npm i -g yarn@1.22.19
      - name: install pnpm@10.29.3
        if: steps.affected.outputs.run == 'true'
        run: npm i -g pnpm@10.29.3
      - name: install uv@0.10.11
        if: steps.affected.outputs.run == 'true'
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          version: '0.10.11'
      - run: pnpm install
        if: steps.affected.outputs.run == 'true'
      - name: Run full unit-test lane
        if: steps.affected.outputs.run == 'true'
        timeout-minutes: 65
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          FORCE_COLOR: '1'
          DD_CIVISIBILITY_AGENTLESS_ENABLED: 'true'
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY_CLI }}
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY_CLI }}
          DD_ENV: ci
          DD_SERVICE: vercel-cli
          DD_PROFILING_ENABLED: 'false'
          DD_NATIVE_METRICS: 'false'
        run: |
          attempt=1
          max_attempts=2
          export NODE_OPTIONS="--require=${GITHUB_WORKSPACE}/utils/dd-trace-ci-init.js"

          while [ "$attempt" -le "$max_attempts" ]; do
            if pnpm turbo run vitest-unit --filter=!vercel --summarize --cache-dir='.turbo' --log-order=stream --continue=always --concurrency=${{ matrix.concurrency }}; then
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Tests failed after $max_attempts attempts."
              exit 1
            fi

            echo "Tests failed; retrying once."
            attempt=$((attempt + 1))
          done

  cli-unit-test:
    name: CLI Unit / ${{ matrix.runner }}/node${{ matrix.nodeVersion }} / ${{ matrix.shard }}/7
    needs: setup
    timeout-minutes: 120
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-14, windows-latest]
        nodeVersion: [20, 22]
        shard: [1, 2, 3, 4, 5, 6, 7]
        exclude:
          - runner: windows-latest
            nodeVersion: 20
    env:
      TURBO_TEST_PLATFORM: ${{ matrix.runner }}-node${{ matrix.nodeVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.headSha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodeVersion }}
      - name: install turbo@2.10.8
        run: npm i -g turbo@2.10.8
      - name: Select full nightly lane
        id: affected
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Setup Go toolchain
        if: steps.affected.outputs.run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.12'
          cache: false
      - name: Setup Rust toolchain
        if: steps.affected.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.96.1'
          targets: wasm32-wasip2
      - name: install yarn@1.22.19
        if: steps.affected.outputs.run == 'true'
        run: npm i -g yarn@1.22.19
      - name: install pnpm@10.29.3
        if: steps.affected.outputs.run == 'true'
        run: npm i -g pnpm@10.29.3
      - name: install uv@0.10.11
        if: steps.affected.outputs.run == 'true'
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          version: '0.10.11'
      - run: pnpm install
        if: steps.affected.outputs.run == 'true'
      - name: Build CLI
        if: steps.affected.outputs.run == 'true'
        run: pnpm turbo run build --filter=vercel --summarize --cache-dir='.turbo' --log-order=stream --continue=always
      - name: Run full CLI unit-test shards
        if: steps.affected.outputs.run == 'true'
        timeout-minutes: 65
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          FORCE_COLOR: '1'
          DD_CIVISIBILITY_AGENTLESS_ENABLED: 'true'
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY_CLI }}
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY_CLI }}
          DD_ENV: ci
          DD_SERVICE: vercel-cli
          DD_PROFILING_ENABLED: 'false'
          DD_NATIVE_METRICS: 'false'
        run: |
          attempt=1
          max_attempts=2
          export NODE_OPTIONS="--require=${GITHUB_WORKSPACE}/utils/dd-trace-ci-init.js"

          while [ "$attempt" -le "$max_attempts" ]; do
            if pnpm turbo run vitest-unit --filter=vercel --only --summarize --cache-dir='.turbo' --log-order=stream --continue=always -- --shard=${{ matrix.shard }}/7; then
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Tests failed after $max_attempts attempts."
              exit 1
            fi

            echo "Tests failed; retrying once."
            attempt=$((attempt + 1))
          done

  e2e-test:
    name: E2E / ${{ matrix.label }}
    needs: setup
    timeout-minutes: 120
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      deployments: read
      id-token: write
      statuses: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: vitest-e2e
            runner: ubuntu-latest
            nodeVersion: 22
            concurrency: 2
            ruby: true
            label: primary/linux/node22
          - task: vitest-e2e-node-20
            runner: ubuntu-latest
            nodeVersion: 20
            concurrency: 1
            ruby: false
            label: firewall/linux/node20
          - task: test-e2e-node-all-versions
            runner: ubuntu-latest
            nodeVersion: 20
            concurrency: 1
            ruby: true
            label: CLI-integration/linux/node20
          - task: test-e2e-node-all-versions
            runner: ubuntu-latest
            nodeVersion: 22
            concurrency: 1
            ruby: true
            label: CLI-integration/linux/node22
          - task: test-e2e-node-all-versions
            runner: ubuntu-latest
            nodeVersion: 24
            concurrency: 1
            ruby: true
            label: CLI-integration/linux/node24
          - task: test-next-local
            runner: ubuntu-latest
            nodeVersion: 22
            concurrency: 1
            ruby: false
            label: Next-local/linux/node22
          - task: test-dev
            runner: ubuntu-latest
            nodeVersion: 22
            concurrency: 1
            ruby: true
            label: CLI-dev/linux/node22
          - task: test-dev
            runner: macos-14
            nodeVersion: 22
            concurrency: 1
            ruby: true
            label: CLI-dev/mac/node22
    env:
      TURBO_TEST_PLATFORM: ${{ matrix.runner }}-node${{ matrix.nodeVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.headSha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodeVersion }}
      - name: install turbo@2.10.8
        run: npm i -g turbo@2.10.8
      - name: Select full nightly lane
        id: affected
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Setup Go toolchain
        if: steps.affected.outputs.run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.12'
          cache: false
      - name: Setup Rust toolchain
        if: steps.affected.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.96.1'
          targets: wasm32-wasip2
      - name: install yarn@1.22.19
        if: steps.affected.outputs.run == 'true'
        run: npm i -g yarn@1.22.19
      - name: install pnpm@10.29.3
        if: steps.affected.outputs.run == 'true'
        run: npm i -g pnpm@10.29.3
      - name: Install uv
        if: steps.affected.outputs.run == 'true'
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          version: '0.10.11'
      - name: Install Ruby + Bundler
        if: steps.affected.outputs.run == 'true' && matrix.ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          ruby-version: '3.3'
      - run: pnpm install
        if: steps.affected.outputs.run == 'true'
      - name: Wait for deployment tarballs
        if: steps.affected.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.setup.outputs.headSha }}
        run: |
          set -euo pipefail

          # E2E needs the CLI and Python wheel tarballs produced by the Vercel
          # preview deployment associated with this commit.
          # Vercel already reports successful deployments back to GitHub via
          # deployment statuses and commit statuses. We poll those GitHub-owned
          # records for candidate public URLs, then trust a URL only after the
          # actual tarball endpoint responds. That final HTTP check is the
          # readiness gate, so stale/unrelated status URLs are harmless.
          validate_deployment_url() {
            local url="${1%/}"
            if [ -z "$url" ]; then
              return 1
            fi

            if curl -fsI "$url/tarballs/vercel.tgz" >/dev/null; then
              echo "DPL_URL=$url" >> "$GITHUB_ENV"
              echo "VERCEL_CLI_VERSION=$url/tarballs/vercel.tgz" >> "$GITHUB_ENV"
              echo "Deployment tarball is ready at $url/tarballs/vercel.tgz"
              return 0
            fi

            return 1
          }

          get_candidate_urls() {
            gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${HEAD_SHA}&per_page=20" \
              --jq '.[].id' | while IFS= read -r deployment_id; do
                gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                  --jq '.[] | select(.state == "success" and .environment_url != null and .environment_url != "") | .environment_url'
              done

            gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" \
              --jq '.statuses[] | select(.state == "success" and .target_url != null and .target_url != "") | .target_url'
          }

          for attempt in {1..120}; do
            while IFS= read -r candidate_url; do
              if validate_deployment_url "$candidate_url"; then
                exit 0
              fi
            done < <(get_candidate_urls | sort -u)

            echo "Deployment tarball is not ready yet (attempt $attempt/120)."
            sleep 10
          done

          echo "Timed out waiting for deployment tarball."
          exit 1
      - name: Resolve Python wheel URLs
        if: steps.affected.outputs.run == 'true'
        run: |
          DEPLOYMENT_URL="$DPL_URL"

          PACKAGES_JSON="$(node utils/get-python-packages.js)"
          if [ -z "$PACKAGES_JSON" ] || [ "$PACKAGES_JSON" = "[]" ]; then
            echo "No Python packages discovered; skipping wheel URL resolution."
            exit 0
          fi

          echo "$PACKAGES_JSON" | jq -c '.[]' | while IFS= read -r package; do
            package_slug="$(echo "$package" | jq -r '.packageDir')"
            package_name="$(echo "$package" | jq -r '.packageName')"

            wheel_name="$(curl -sf "$DEPLOYMENT_URL/tarballs/$package_slug-wheel.json" | jq -r '.filename' || echo "")"
            if [ -z "$wheel_name" ]; then
              continue
            fi

            env_var="$(printf '%s' "$package_name" | tr -c '[:alnum:]' '_' | tr '[:lower:]' '[:upper:]')_PYTHON"
            echo "$env_var=$package_name @ $DEPLOYMENT_URL/tarballs/$wheel_name" >> "$GITHUB_ENV"
          done
      - name: Run full E2E lane
        if: steps.affected.outputs.run == 'true'
        timeout-minutes: 45
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          FORCE_COLOR: '1'
          DD_CIVISIBILITY_AGENTLESS_ENABLED: 'true'
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY_CLI }}
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY_CLI }}
          DD_ENV: ci
          DD_SERVICE: vercel-cli
          DD_PROFILING_ENABLED: 'false'
          DD_NATIVE_METRICS: 'false'
        run: |
          attempt=1
          max_attempts=2
          export NODE_OPTIONS="--require=${GITHUB_WORKSPACE}/utils/dd-trace-ci-init.js"

          while [ "$attempt" -le "$max_attempts" ]; do
            if pnpm turbo run ${{ matrix.task }} --summarize --cache-dir='.turbo' --log-order=stream --continue=always --concurrency=${{ matrix.concurrency }}; then
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Tests failed after $max_attempts attempts."
              exit 1
            fi

            echo "Tests failed; retrying once."
            attempt=$((attempt + 1))
          done

  alert-on-failure:
    name: Alert On Failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - setup
      - unit-test
      - cli-unit-test
      - e2e-test
    permissions:
      issues: write
    steps:
      - name: Check results
        id: check-all
        run: |-
          for status in ${{ join(needs.*.result, ' ') }}
          do
            if [ "$status" != "success" ] && [ "$status" != "skipped" ]
            then
              echo "Some checks failed"
              echo "state=failure" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "state=success" >> $GITHUB_OUTPUT
      - name: Open or update alert issue
        if: ${{ steps.check-all.outputs.state == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Nightly no-cache test run failed';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = [
              `The nightly full test suite (turbo cache disabled) failed on \`${{ github.sha }}\`.`,
              '',
              `Run: ${runUrl}`,
              '',
              '_This issue is created automatically by the `Nightly Tests (No Turbo Cache)` workflow while we investigate turborepo cache key issues._',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-no-cache-failure',
              per_page: 10,
            });

            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Failed again on \`${{ github.sha }}\`: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['nightly-no-cache-failure'],
              });
            }
      - name: Fail the job if the run failed
        if: ${{ steps.check-all.outputs.state == 'failure' }}
        run: exit 1
