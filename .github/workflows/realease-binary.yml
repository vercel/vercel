name: Release Binary
# Filename `realease-binary.yml` (typo) is intentional: npm trusted publishers
# for @vercel/vc-native* were registered against this spelling.

on:
  # Called from Release before vercel is published so natives exist on npm
  # for optionalDependencies injection.
  workflow_call:
    inputs:
      ref:
        description: Git ref (SHA) to checkout and build
        required: false
        type: string
        default: ''
    secrets:
      SENTRY_DSN:
        required: false
      APPLE_CERT_DATA:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_CERT_PASSWORD:
        required: false
  # Manual rebuilds / republishes of an existing version, and natives-first
  # dispatch from Release (so npm trusted publishing sees this workflow file
  # as the top-level identity — workflow_call presents release.yml instead).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. vercel@53.3.1). Optional when ref is set.
        required: false
        type: string
        default: ''
      ref:
        description: Git SHA to checkout/build (natives-first from Release before vercel is tagged)
        required: false
        type: string
        default: ''

# Default read; build job elevates to write for GitHub Release uploads on
# workflow_dispatch. The Release caller must grant contents: write so that
# job-level elevation is allowed under workflow_call permission capping.
permissions:
  contents: read
  id-token: write

env:
  TURBO_CACHE: 'remote:rw'

concurrency:
  group: release-binary-${{ inputs.ref || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.asset }}
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-15-xlarge
            target: node24.14.1-macos-arm64
            asset: vercel-darwin-arm64
            ext: ''
            sign: true
            smoke: true
            custom_node_path: .node-runtime/node-v24.14.1-darwin-arm64-small-icu/bin/node
            custom_node_platform: darwin
            custom_node_arch: arm64
          - runs-on: macos-15-large
            target: node24.14.1-macos-x64
            asset: vercel-darwin-x64
            ext: ''
            sign: true
            smoke: true
            custom_node_path: ''
            custom_node_platform: ''
            custom_node_arch: ''
          # Linux runtimes are prebuilt inside manylinux_2_28 (glibc floor
          # 2.28) by build-node-runtime.yml and downloaded below; the glibc
          # ceiling is re-verified on the final binary in this workflow.
          # Use paid org larger runners (same labels as front/api). The
          # *-oss pool is for public repos and never assigns on private
          # vercel-internal.
          - runs-on: ubuntu-latest-32-core-arm
            target: node24.14.1-linux-arm64
            asset: vercel-linux-arm64
            ext: ''
            sign: false
            smoke: true
            custom_node_path: .node-runtime/node-v24.14.1-linux-arm64-small-icu/bin/node
            custom_node_platform: linux
            custom_node_arch: arm64
          - runs-on: ubuntu-latest-32-core
            target: node24.14.1-linux-x64
            asset: vercel-linux-x64
            ext: ''
            sign: false
            smoke: true
            custom_node_path: .node-runtime/node-v24.14.1-linux-x64-small-icu/bin/node
            custom_node_platform: linux
            custom_node_arch: x64
          # Windows was previously skipped because the custom Node embed took
          # ~45-80+ min on windows-2022. The runtime is now prebuilt, so this
          # is just a pkg link + smoke test. Re-enabling also requires the
          # win32 platform in packages/vc-native/scripts/platforms.mjs.
          # Standard windows-2022 (not windows-latest-8-core / *-oss): the org
          # has no Windows Server 2022 larger runner shared with this private
          # repo; invented labels like windows-2022-8-core queue forever.
          # - runs-on: windows-2022
          #   target: node24.14.1-win-x64
          #   asset: vercel-windows-x64
          #   ext: '.exe'
          #   sign: false
          #   smoke: true
          #   custom_node_path: .node-runtime/node-v24.14.1-win-x64-small-icu/node.exe
          #   custom_node_platform: win
          #   custom_node_arch: x64
    runs-on: ${{ matrix['runs-on'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - name: Require tag or ref for workflow_dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' && inputs.ref == '' }}
        run: |
          echo "::error::workflow_dispatch requires inputs.tag or inputs.ref"
          exit 1

      - name: Setup Turborepo Remote Cache
        uses: vercel/setup-turborepo-remote-cache-action@3df3d75a5268bbe2a4ee66048f56f3a86d6e21b7
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: wasm32-wasip2

      # The workspace build compiles @vercel-internals/ipc-proxy, which
      # requires a Go toolchain on PATH (build.mjs hard-fails in GitHub
      # Actions rather than downloading Go). Keep in sync with GO_VERSION
      # in internals/ipc-proxy/build.mjs and test.yml.
      - name: Setup Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.12'
          cache: false

      # windows-2022: turbo children lose setup-go PATH, and spawning go.exe via
      # the C:\hostedtoolcache junction has also failed. Resolve the real path
      # (often D:\...) and persist GO_BIN for ipc-proxy/build.mjs.
      - name: Persist Go toolchain env
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go version
          $goCmd = Get-Command go
          $goBin = $goCmd.Source
          try {
            $item = Get-Item -LiteralPath $goBin -Force
            if ($item.LinkType -and $item.Target) {
              $target = @($item.Target)[0]
              if ($target) { $goBin = $target }
            }
          } catch {}
          $goroot = (go env GOROOT).Trim()
          Add-Content -Path $env:GITHUB_ENV -Value "GOROOT=$goroot"
          Add-Content -Path $env:GITHUB_ENV -Value "GO_BIN=$goBin"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $goBin)
          Write-Host "GOROOT=$goroot"
          Write-Host "GO_BIN=$goBin"
          & $goBin version

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: 'pyproject.toml'

      - name: Install uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          enable-cache: false

      - name: Install pnpm
        run: npm i -g pnpm@10.29.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GO_BIN) {
            Write-Host "Using GO_BIN=$env:GO_BIN"
            & $env:GO_BIN version
            $env:PATH = "$(Split-Path -Parent $env:GO_BIN);$env:PATH"
          } else {
            go version
          }
          pnpm build
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      # Prebuilt by build-node-runtime.yml and published to the rolling
      # `node-runtime-v<version>` GitHub Release. Compiling Node from source
      # here previously took 45-80+ minutes per platform; if this download
      # fails because an asset is missing, dispatch "Build Node Runtime" to
      # (re)publish the runtimes for this Node version.
      - name: Download prebuilt Node runtime
        if: ${{ matrix.custom_node_path != '' }}
        shell: bash
        working-directory: packages/cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_CLI_NODE_VERSION: 24.14.1
          VERCEL_CLI_NODE_PLATFORM: ${{ matrix.custom_node_platform }}
          VERCEL_CLI_NODE_ARCH: ${{ matrix.custom_node_arch }}
        run: |
          set -euo pipefail
          dir="node-v${VERCEL_CLI_NODE_VERSION}-${VERCEL_CLI_NODE_PLATFORM}-${VERCEL_CLI_NODE_ARCH}-small-icu"
          tag="node-runtime-v${VERCEL_CLI_NODE_VERSION}"
          mkdir -p .node-runtime
          cd .node-runtime
          if ! gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$dir.tar.gz" \
            --pattern "$dir.tar.gz.sha256"; then
            echo "::error::Could not download $dir.tar.gz from release $tag. Run the 'Build Node Runtime' workflow to publish runtimes for this Node version."
            exit 1
          fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 -c "$dir.tar.gz.sha256"
          else
            sha256sum -c "$dir.tar.gz.sha256"
          fi
          tar -xzf "$dir.tar.gz"
          rm "$dir.tar.gz" "$dir.tar.gz.sha256"
          test -e "$dir/bin/node" -o -e "$dir/node.exe"

      - name: Build binary
        working-directory: packages/cli
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VERCEL_CLI_BINARY_NODE_PATH: ${{ matrix.custom_node_path }}
        run: node scripts/build-binary.mjs --target ${{ matrix.target }} --compress Brotli --output ./dist-bin/${{ matrix.asset }}${{ matrix.ext }}

      - name: Verify linux binary glibc ceiling
        if: ${{ matrix.custom_node_platform == 'linux' }}
        working-directory: packages/cli
        run: |
          set -euo pipefail
          bin="dist-bin/${{ matrix.asset }}${{ matrix.ext }}"
          node scripts/check-binary-glibc.mjs "$bin" 2.28

      - name: Smoke test binary before signing
        shell: bash
        working-directory: packages/cli
        run: |
          set -euo pipefail
          bin="dist-bin/${{ matrix.asset }}${{ matrix.ext }}"
          chmod +x "$bin" || true
          node scripts/smoke-test-binary.mjs "$bin"

      - name: Install rcodesign
        if: ${{ matrix.sign }}
        run: cargo install apple-codesign --locked

      - name: Write Apple signing certificate
        if: ${{ matrix.sign }}
        shell: bash
        env:
          APPLE_CERT_DATA: ${{ secrets.APPLE_CERT_DATA }}
          APPLE_CERT_PATH: ${{ runner.temp }}/apple-certificate.p12
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_CERT_DATA" ]]; then
            echo "::error::APPLE_CERT_DATA secret is empty or unavailable"
            exit 1
          fi
          echo "$APPLE_CERT_DATA" | base64 --decode > "$APPLE_CERT_PATH"
          if [[ ! -s "$APPLE_CERT_PATH" ]]; then
            echo "::error::Decoded Apple certificate is empty"
            exit 1
          fi
          echo "APPLE_CERT_PATH=$APPLE_CERT_PATH" >> "$GITHUB_ENV"

      - name: Write Apple notarization API key
        if: ${{ matrix.sign }}
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple-api-key.json
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_API_KEY" ]]; then
            echo "::error::APPLE_API_KEY secret is empty or unavailable"
            exit 1
          fi
          echo "$APPLE_API_KEY" | base64 --decode > "$APPLE_API_KEY_PATH"
          if [[ ! -s "$APPLE_API_KEY_PATH" ]]; then
            echo "::error::Decoded Apple API key is empty"
            exit 1
          fi
          echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Sign binary
        if: ${{ matrix.sign }}
        shell: bash
        working-directory: packages/cli
        env:
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          VERCEL_CLI_APPLE_SIGNING_IDENTIFIER: com.vercel.vercel-cli
        run: |
          set -euo pipefail
          bin="dist-bin/${{ matrix.asset }}${{ matrix.ext }}"
          rcodesign sign \
            --for-notarization \
            --binary-identifier "$VERCEL_CLI_APPLE_SIGNING_IDENTIFIER" \
            --entitlements-xml-path entitlements.plist \
            --p12-file "$APPLE_CERT_PATH" \
            --p12-password "$APPLE_CERT_PASSWORD" \
            "$bin"

          requirement=$(codesign -dr - "$bin" 2>&1)
          printf '%s\n' "$requirement"
          expected_identifier="identifier \"$VERCEL_CLI_APPLE_SIGNING_IDENTIFIER\""
          if [[ "$requirement" != *"$expected_identifier"* ]]; then
            echo "::error::Expected designated requirement to contain $expected_identifier"
            exit 1
          fi
      - name: Notarize binary
        if: ${{ matrix.sign }}
        shell: bash
        working-directory: packages/cli
        run: |
          set -euo pipefail
          bin="dist-bin/${{ matrix.asset }}${{ matrix.ext }}"
          zip_path="$RUNNER_TEMP/${{ matrix.asset }}${{ matrix.ext }}.zip"
          ditto -c -k --keepParent "$bin" "$zip_path"
          rcodesign notary-submit \
            --api-key-file "$APPLE_API_KEY_PATH" \
            --wait \
            "$zip_path"
      - name: Smoke test binary after signing
        if: ${{ matrix.smoke }}
        shell: bash
        working-directory: packages/cli
        run: |
          set -euo pipefail
          bin="dist-bin/${{ matrix.asset }}${{ matrix.ext }}"
          chmod +x "$bin" || true
          node scripts/smoke-test-binary.mjs "$bin"

      - name: Compute checksum
        shell: bash
        working-directory: packages/cli
        run: |
          file="dist-bin/${{ matrix.asset }}${{ matrix.ext }}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 "$file" > "$file.sha256"
          else
            sha256sum "$file" > "$file.sha256"
          fi
          cat "$file.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}${{ matrix.ext }}
          path: packages/cli/dist-bin/${{ matrix.asset }}${{ matrix.ext }}
          retention-days: 3
          if-no-files-found: error

      - name: Wait for GitHub Release
        # Only when rebuilding against an existing release tag — not when
        # Release dispatches with a bare SHA for natives-first publish.
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          release_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG"
          for i in $(seq 1 30); do
            response="$(mktemp)"
            status="$(curl -sS -L -o "$response" -w "%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$release_url")"

            if [[ "$status" == "200" ]]; then
              echo "Release $TAG ready"
              exit 0
            fi
            if [[ "$status" != "404" ]]; then
              cat "$response"
            fi
            echo "Waiting for release $TAG to be created ($i/30)..."
            sleep 10
          done
          echo "::error::Timed out waiting for release $TAG after 5 minutes"
          exit 1

      - name: Upload to GitHub Release
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
        shell: bash
        working-directory: packages/cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          auth_headers=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          release_json="$(mktemp)"
          status="$(curl -sS -L -o "$release_json" -w "%{http_code}" \
            "${auth_headers[@]}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"

          if [[ "$status" != "200" ]]; then
            cat "$release_json"
            echo "::error::Could not fetch GitHub Release $TAG"
            exit 1
          fi

          release_id="$(node -e "const fs = require('fs'); console.log(JSON.parse(fs.readFileSync(process.argv[1], 'utf8')).id)" "$release_json")"
          upload_url="$(node -e "const fs = require('fs'); console.log(JSON.parse(fs.readFileSync(process.argv[1], 'utf8')).upload_url.split('{')[0])" "$release_json")"

          request() {
            local output="$1"
            shift
            local status
            status="$(curl -sS -L -o "$output" -w "%{http_code}" "$@")"
            if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
              cat "$output"
              echo "::error::GitHub API request failed with HTTP $status"
              exit 1
            fi
          }

          upload_asset() {
            local file="$1"
            local name
            name="$(basename "$file")"
            local encoded_name
            encoded_name="$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$name")"

            local assets_json
            assets_json="$(mktemp)"
            request "$assets_json" \
              "${auth_headers[@]}" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100"

            local existing_asset_id
            existing_asset_id="$(node -e "const fs = require('fs'); const assets = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); const asset = assets.find(asset => asset.name === process.argv[2]); console.log(asset?.id ?? '')" "$assets_json" "$name")"

            if [[ -n "$existing_asset_id" ]]; then
              request /dev/null \
                -X DELETE \
                "${auth_headers[@]}" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$existing_asset_id"
            fi

            request /dev/null \
              -X POST \
              "${auth_headers[@]}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "$upload_url?name=$encoded_name"
          }

          upload_asset "dist-bin/${{ matrix.asset }}${{ matrix.ext }}"
          upload_asset "dist-bin/${{ matrix.asset }}${{ matrix.ext }}.sha256"

  publish-npm:
    name: Publish native npm packages
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm 11
        run: npm i -g npm@11

      - name: Print npm version
        run: npm --version

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages/cli/dist-bin
          merge-multiple: true

      # workflow_call (legacy) / Release dispatch with inputs.ref: always publish
      # so vercel can inject optionalDependencies (default latest dist-tag).
      # Manual workflow_dispatch with only inputs.tag: publish latest when the
      # CLI version matches npm latest, otherwise a rebuild-* dist-tag.
      - name: Publish native npm packages
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "${{ inputs.tag }}" && -z "${{ inputs.ref }}" ]]; then
            version="$(node -p "require('./packages/cli/package.json').version")"
            latest="$(npm view vercel version)"
            if [[ "$version" == "$latest" ]]; then
              node packages/vc-native/scripts/publish-packages.mjs
            else
              node packages/vc-native/scripts/publish-packages.mjs --tag "rebuild-$version"
            fi
          else
            node packages/vc-native/scripts/publish-packages.mjs
          fi

      - name: Verify @vercel/vc-native global install
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/cli/package.json').version")"
          for i in $(seq 1 12); do
            prefix="$(mktemp -d)"
            cache="$(mktemp -d)"
            if npm --cache "$cache" install -g --prefix "$prefix" "@vercel/vc-native@$version" --force --allow-scripts=@vercel/vc-native && [[ -x "$prefix/bin/vercel" ]]; then
              out="$($prefix/bin/vercel --version)"
              echo "$out"
              if [[ "$out" == "$version" ]]; then
                node packages/cli/scripts/smoke-test-binary.mjs "$prefix/bin/vercel"
                exit 0
              fi
            fi
            echo "Waiting for @vercel/vc-native to become installable ($i/12)..."
            sleep 10
          done
          echo "::error::@vercel/vc-native did not install a working vercel binary for $version"
          exit 1
