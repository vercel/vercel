name: Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: read
  deployments: read
  statuses: write

env:
  VERCEL_TELEMETRY_DISABLED: '1'
  TURBO_REMOTE_ONLY: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Find Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    outputs:
      baseSha: ${{ steps.pr-context.outputs.baseSha }}
      headSha: ${{ steps.pr-context.outputs.headSha }}
    steps:
      - name: Resolve PR context
        id: pr-context
        run: |
          echo "baseSha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          echo "headSha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      # The `context` here MUST exactly match the one written by the
      # `Report status to PR commit` step in the `summary` job below.
      - name: Post pending Summary status to PR commit
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.pr-context.outputs.headSha }}',
              state: 'pending',
              context: 'Summary',
              target_url: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              description: 'Tests in progress',
            });

  unit-test:
    name: Unit / ${{ matrix.label }}
    needs: setup
    timeout-minutes: 120
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            nodeVersion: 20
            concurrency: 2
            label: linux/node20
          - runner: ubuntu-latest
            nodeVersion: 22
            concurrency: 2
            label: linux/node22
          - runner: macos-14
            nodeVersion: 20
            concurrency: 2
            label: mac/node20
          - runner: macos-14
            nodeVersion: 22
            concurrency: 2
            label: mac/node22
          - runner: windows-latest
            nodeVersion: 22
            concurrency: 1
            label: win/node22
    env:
      TURBO_SCM_BASE: ${{ needs.setup.outputs.baseSha }}
      TURBO_SCM_HEAD: ${{ needs.setup.outputs.headSha }}
      TURBO_TEST_PLATFORM: ${{ matrix.runner }}-node${{ matrix.nodeVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.headSha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodeVersion }}
      - name: install turbo@2.10.8
        run: npm i -g turbo@2.10.8
      - name: Check for affected unit tests
        id: affected
        run: |
          set -euo pipefail
          node utils/gen.js
          count=$(turbo run vitest-unit --affected --filter=!vercel --dry=json | jq '[.tasks[] | select(.task == "vitest-unit" and .command != "<NONEXISTENT>")] | length')
          if [ "$count" -gt 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No affected unit-test tasks."
          fi
      - name: Setup Turborepo Remote Cache
        if: steps.affected.outputs.run == 'true'
        uses: vercel/setup-turborepo-remote-cache-action@3df3d75a5268bbe2a4ee66048f56f3a86d6e21b7
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: Setup Go toolchain
        if: steps.affected.outputs.run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.12'
          cache: false
      - name: Setup Rust toolchain
        if: steps.affected.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.96.1'
          targets: wasm32-wasip2
      # yarn 1.22.21 introduced a Corepack bug when running tests.
      - name: install yarn@1.22.19
        if: steps.affected.outputs.run == 'true'
        run: npm i -g yarn@1.22.19
      - name: install pnpm@10.29.3
        if: steps.affected.outputs.run == 'true'
        run: npm i -g pnpm@10.29.3
      - name: install uv@0.10.11
        if: steps.affected.outputs.run == 'true'
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          version: '0.10.11'
      - run: pnpm install
        if: steps.affected.outputs.run == 'true'
      - name: Run affected unit tests
        if: steps.affected.outputs.run == 'true'
        timeout-minutes: 65
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          FORCE_COLOR: '1'
          DD_CIVISIBILITY_AGENTLESS_ENABLED: 'true'
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY_CLI }}
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY_CLI }}
          DD_ENV: ci
          DD_SERVICE: vercel-cli
          DD_PROFILING_ENABLED: 'false'
          DD_NATIVE_METRICS: 'false'
        run: |
          attempt=1
          max_attempts=2
          export NODE_OPTIONS="--require=${GITHUB_WORKSPACE}/utils/dd-trace-ci-init.js"

          while [ "$attempt" -le "$max_attempts" ]; do
            if pnpm turbo run vitest-unit --affected --filter=!vercel --summarize --cache-dir='.turbo' --log-order=stream --continue=always --concurrency=${{ matrix.concurrency }}; then
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Tests failed after $max_attempts attempts."
              exit 1
            fi

            echo "Tests failed; retrying once."
            attempt=$((attempt + 1))
          done

  cli-unit-test:
    name: CLI Unit / ${{ matrix.runner }}/node${{ matrix.nodeVersion }} / ${{ matrix.shard }}/7
    needs: setup
    timeout-minutes: 120
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-14, windows-latest]
        nodeVersion: [20, 22]
        shard: [1, 2, 3, 4, 5, 6, 7]
        exclude:
          - runner: windows-latest
            nodeVersion: 20
    env:
      TURBO_SCM_BASE: ${{ needs.setup.outputs.baseSha }}
      TURBO_SCM_HEAD: ${{ needs.setup.outputs.headSha }}
      TURBO_TEST_PLATFORM: ${{ matrix.runner }}-node${{ matrix.nodeVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.headSha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodeVersion }}
      - name: install turbo@2.10.8
        run: npm i -g turbo@2.10.8
      - name: Check for affected CLI unit tests
        id: affected
        run: |
          set -euo pipefail
          node utils/gen.js
          count=$(turbo run vitest-unit --affected --filter=vercel --dry=json | jq '[.tasks[] | select(.task == "vitest-unit" and .command != "<NONEXISTENT>")] | length')
          if [ "$count" -gt 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No affected CLI unit-test task."
          fi
      - name: Setup Turborepo Remote Cache
        if: steps.affected.outputs.run == 'true'
        uses: vercel/setup-turborepo-remote-cache-action@3df3d75a5268bbe2a4ee66048f56f3a86d6e21b7
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: Setup Go toolchain
        if: steps.affected.outputs.run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.12'
          cache: false
      - name: Setup Rust toolchain
        if: steps.affected.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.96.1'
          targets: wasm32-wasip2
      - name: install yarn@1.22.19
        if: steps.affected.outputs.run == 'true'
        run: npm i -g yarn@1.22.19
      - name: install pnpm@10.29.3
        if: steps.affected.outputs.run == 'true'
        run: npm i -g pnpm@10.29.3
      - name: install uv@0.10.11
        if: steps.affected.outputs.run == 'true'
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          version: '0.10.11'
      - run: pnpm install
        if: steps.affected.outputs.run == 'true'
      - name: Build affected CLI
        if: steps.affected.outputs.run == 'true'
        run: pnpm turbo run build --affected --filter=vercel --summarize --cache-dir='.turbo' --log-order=stream --continue=always
      - name: Run affected CLI unit tests
        if: steps.affected.outputs.run == 'true'
        timeout-minutes: 65
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          FORCE_COLOR: '1'
          DD_CIVISIBILITY_AGENTLESS_ENABLED: 'true'
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY_CLI }}
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY_CLI }}
          DD_ENV: ci
          DD_SERVICE: vercel-cli
          DD_PROFILING_ENABLED: 'false'
          DD_NATIVE_METRICS: 'false'
        run: |
          attempt=1
          max_attempts=2
          export NODE_OPTIONS="--require=${GITHUB_WORKSPACE}/utils/dd-trace-ci-init.js"

          while [ "$attempt" -le "$max_attempts" ]; do
            if pnpm turbo run vitest-unit --affected --filter=vercel --only --summarize --cache-dir='.turbo' --log-order=stream --continue=always -- --shard=${{ matrix.shard }}/7; then
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Tests failed after $max_attempts attempts."
              exit 1
            fi

            echo "Tests failed; retrying once."
            attempt=$((attempt + 1))
          done

  e2e-test:
    name: E2E / ${{ matrix.label }}
    needs: setup
    timeout-minutes: 120
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      deployments: read
      id-token: write
      statuses: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: vitest-e2e
            runner: ubuntu-latest
            nodeVersion: 22
            concurrency: 2
            ruby: true
            label: primary/linux/node22
          - task: vitest-e2e-node-20
            runner: ubuntu-latest
            nodeVersion: 20
            concurrency: 1
            ruby: false
            label: firewall/linux/node20
          - task: test-e2e-node-all-versions
            runner: ubuntu-latest
            nodeVersion: 20
            concurrency: 1
            ruby: true
            label: CLI-integration/linux/node20
          - task: test-e2e-node-all-versions
            runner: ubuntu-latest
            nodeVersion: 22
            concurrency: 1
            ruby: true
            label: CLI-integration/linux/node22
          - task: test-e2e-node-all-versions
            runner: ubuntu-latest
            nodeVersion: 24
            concurrency: 1
            ruby: true
            label: CLI-integration/linux/node24
          - task: test-next-local
            runner: ubuntu-latest
            nodeVersion: 22
            concurrency: 1
            ruby: false
            label: Next-local/linux/node22
          - task: test-dev
            runner: ubuntu-latest
            nodeVersion: 22
            concurrency: 1
            ruby: true
            label: CLI-dev/linux/node22
          - task: test-dev
            runner: macos-14
            nodeVersion: 22
            concurrency: 1
            ruby: true
            label: CLI-dev/mac/node22
    env:
      TURBO_SCM_BASE: ${{ needs.setup.outputs.baseSha }}
      TURBO_SCM_HEAD: ${{ needs.setup.outputs.headSha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.headSha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodeVersion }}
      - name: install turbo@2.10.8
        run: npm i -g turbo@2.10.8
      - name: Check for affected E2E tests
        id: affected
        run: |
          set -euo pipefail
          node utils/gen.js
          count=$(turbo run ${{ matrix.task }} --affected --dry=json | jq '[.tasks[] | select(.task == "${{ matrix.task }}" and .command != "<NONEXISTENT>")] | length')
          if [ "$count" -gt 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No affected ${{ matrix.task }} tasks."
          fi
      - name: Setup Turborepo Remote Cache
        if: steps.affected.outputs.run == 'true'
        uses: vercel/setup-turborepo-remote-cache-action@3df3d75a5268bbe2a4ee66048f56f3a86d6e21b7
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: Setup Go toolchain
        if: steps.affected.outputs.run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.12'
          cache: false
      - name: Setup Rust toolchain
        if: steps.affected.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.96.1'
          targets: wasm32-wasip2
      - name: install yarn@1.22.19
        if: steps.affected.outputs.run == 'true'
        run: npm i -g yarn@1.22.19
      - name: install pnpm@10.29.3
        if: steps.affected.outputs.run == 'true'
        run: npm i -g pnpm@10.29.3
      - name: Install uv
        if: steps.affected.outputs.run == 'true'
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          version: '0.10.11'
      - name: Install Ruby + Bundler
        if: steps.affected.outputs.run == 'true' && matrix.ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          ruby-version: '3.3'
      - run: pnpm install
        if: steps.affected.outputs.run == 'true'
      - name: Wait for deployment tarballs
        if: steps.affected.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.setup.outputs.headSha }}
        run: |
          set -euo pipefail

          # Deployment statuses can appear before artifacts are available, so
          # the tarball endpoint is the final readiness check.
          validate_deployment_url() {
            local url="${1%/}"
            if [ -n "$url" ] && curl -fsI "$url/tarballs/vercel.tgz" >/dev/null; then
              echo "DPL_URL=$url" >> "$GITHUB_ENV"
              echo "VERCEL_CLI_VERSION=$url/tarballs/vercel.tgz" >> "$GITHUB_ENV"
              return 0
            fi
            return 1
          }

          get_candidate_urls() {
            gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${HEAD_SHA}&per_page=20" \
              --jq '.[].id' | while IFS= read -r deployment_id; do
                gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                  --jq '.[] | select(.state == "success" and .environment_url != null and .environment_url != "") | .environment_url'
              done

            gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" \
              --jq '.statuses[] | select(.state == "success" and .target_url != null and .target_url != "") | .target_url'
          }

          for attempt in {1..120}; do
            while IFS= read -r candidate_url; do
              if validate_deployment_url "$candidate_url"; then
                exit 0
              fi
            done < <(get_candidate_urls | sort -u)

            echo "Deployment tarball is not ready yet (attempt $attempt/120)."
            sleep 10
          done

          echo "Timed out waiting for deployment tarball."
          exit 1
      - name: Resolve Python wheel URLs
        if: steps.affected.outputs.run == 'true'
        run: |
          packages_json=$(node utils/get-python-packages.js)
          if [ -z "$packages_json" ] || [ "$packages_json" = "[]" ]; then
            exit 0
          fi

          echo "$packages_json" | jq -c '.[]' | while IFS= read -r package; do
            package_slug=$(echo "$package" | jq -r '.packageDir')
            package_name=$(echo "$package" | jq -r '.packageName')
            wheel_name=$(curl -sf "$DPL_URL/tarballs/$package_slug-wheel.json" | jq -r '.filename' || true)
            if [ -z "$wheel_name" ]; then
              continue
            fi

            env_var=$(printf '%s' "$package_name" | tr -c '[:alnum:]' '_' | tr '[:lower:]' '[:upper:]')_PYTHON
            echo "$env_var=$package_name @ $DPL_URL/tarballs/$wheel_name" >> "$GITHUB_ENV"
          done
      - name: Run affected E2E tests
        if: steps.affected.outputs.run == 'true'
        timeout-minutes: 45
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          FORCE_COLOR: '1'
          DD_CIVISIBILITY_AGENTLESS_ENABLED: 'true'
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY_CLI }}
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY_CLI }}
          DD_ENV: ci
          DD_SERVICE: vercel-cli
          DD_PROFILING_ENABLED: 'false'
          DD_NATIVE_METRICS: 'false'
        run: |
          attempt=1
          max_attempts=2
          export NODE_OPTIONS="--require=${GITHUB_WORKSPACE}/utils/dd-trace-ci-init.js"

          while [ "$attempt" -le "$max_attempts" ]; do
            if pnpm turbo run ${{ matrix.task }} --affected --summarize --cache-dir='.turbo' --log-order=stream --continue=always --concurrency=${{ matrix.concurrency }}; then
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Tests failed after $max_attempts attempts."
              exit 1
            fi

            echo "Tests failed; retrying once."
            attempt=$((attempt + 1))
          done

  summary:
    name: Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - setup
      - unit-test
      - cli-unit-test
      - e2e-test
    permissions:
      statuses: write
    steps:
      - name: Check All
        id: check-all
        continue-on-error: true
        run: |-
          for status in ${{ join(needs.*.result, ' ') }}
          do
            if [ "$status" != "success" ] && [ "$status" != "skipped" ]
            then
              echo "Some checks failed"
              echo "state=failure" >> $GITHUB_OUTPUT
              exit 1
            fi
          done
          echo "state=success" >> $GITHUB_OUTPUT
      - name: Report status to PR commit
        if: ${{ always() && needs.setup.outputs.headSha }}
        uses: actions/github-script@v7
        env:
          CHECK_STATE: ${{ steps.check-all.outputs.state }}
        with:
          script: |
            const state = process.env.CHECK_STATE === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.setup.outputs.headSha }}',
              state,
              context: 'Summary',
              target_url: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              description: state === 'success' ? 'All checks passed' : 'Some checks failed',
            });
      - name: Fail the job if Check All failed
        if: ${{ steps.check-all.outcome == 'failure' }}
        run: exit 1
