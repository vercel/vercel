name: Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: read
  deployments: read
  statuses: write

env:
  VERCEL_TELEMETRY_DISABLED: '1'
  TURBO_CACHE: 'remote:rw'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Find Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      statuses: write
    outputs:
      e2e-tests: ${{ steps.e2e-matrix.outputs.e2eTests }}
      baseSha: ${{ steps.pr-context.outputs.baseSha }}
      headSha: ${{ steps.pr-context.outputs.headSha }}
    steps:
      - name: Resolve PR context
        id: pr-context
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "baseSha=$BASE_SHA" >> $GITHUB_OUTPUT
          echo "headSha=$HEAD_SHA" >> $GITHUB_OUTPUT
      # The `context` here MUST exactly match the one written by the
      # `Report status to PR commit` step in the `summary` job below.
      # GitHub commit statuses are upserted by `(sha, context)`, so a
      # mismatch would create a second row instead of overwriting this
      # pending one with the final result.
      - name: Post pending Summary status to PR commit
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.pr-context.outputs.headSha }}',
              state: 'pending',
              context: 'Summary',
              target_url: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              description: 'Tests in progress',
            });
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.pr-context.outputs.headSha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Turborepo Remote Cache
        uses: vercel/setup-turborepo-remote-cache-action@3df3d75a5268bbe2a4ee66048f56f3a86d6e21b7
        with:
          team: ${{ vars.TURBO_TEAM }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install turbo@2.10.8
        run: npm i -g turbo@2.10.8
      - name: Build E2E test matrix
        id: e2e-matrix
        env:
          TURBO_SCM_BASE: ${{ steps.pr-context.outputs.baseSha }}
          TURBO_SCM_HEAD: ${{ steps.pr-context.outputs.headSha }}
        run: |
          set -euo pipefail
          plan=$(turbo run test-e2e test-e2e-node-all-versions test-next-local test-dev --affected --dry=json)
          tasks=$(printf '%s' "$plan" | jq -c '[
            .tasks[]
            | select(
                (.task == "test-e2e"
                  or .task == "test-e2e-node-all-versions"
                  or .task == "test-next-local"
                  or .task == "test-dev")
                and .command != "<NONEXISTENT>"
              )
            | {package, directory, task}
          ]')
          matrix=$(TURBO_TASKS="$tasks" node utils/chunk-tests.js)
          echo "e2eTests=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq

  unit-test:
    name: Unit / ${{ matrix.label }}
    needs: setup
    timeout-minutes: 120
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            nodeVersion: 20
            concurrency: 2
            label: linux/node20
          - runner: ubuntu-latest
            nodeVersion: 22
            concurrency: 2
            label: linux/node22
          - runner: macos-14
            nodeVersion: 20
            concurrency: 2
            label: mac/node20
          - runner: macos-14
            nodeVersion: 22
            concurrency: 2
            label: mac/node22
          - runner: windows-latest-8-core
            nodeVersion: 22
            concurrency: 1
            label: win/node22
    env:
      TURBO_SCM_BASE: ${{ needs.setup.outputs.baseSha }}
      TURBO_SCM_HEAD: ${{ needs.setup.outputs.headSha }}
      NODE_VERSION: ${{ matrix.nodeVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.headSha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodeVersion }}
      - name: install turbo@2.10.8
        run: npm i -g turbo@2.10.8
      - name: Check for affected unit tests
        id: affected
        run: |
          set -euo pipefail
          node utils/gen.js
          count=$(turbo run test-unit --affected --filter=!vercel --dry=json | jq '[.tasks[] | select(.task == "test-unit" and .command != "<NONEXISTENT>")] | length')
          if [ "$count" -gt 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No affected unit-test tasks."
          fi
      - parallel:
          - name: Setup Turborepo Remote Cache
            if: steps.affected.outputs.run == 'true'
            uses: ./.github/actions/setup-turborepo-remote-cache
            with:
              team: ${{ vars.TURBO_TEAM }}
          - name: Setup Go toolchain
            if: steps.affected.outputs.run == 'true'
            uses: ./.github/actions/setup-go
            with:
              go-version: '1.23.12'
              cache: false
          - name: Setup Rust toolchain
            if: steps.affected.outputs.run == 'true'
            uses: ./.github/actions/setup-rust
            with:
              toolchain: '1.96.1'
              targets: wasm32-wasip2
          - name: install uv@0.10.11
            if: steps.affected.outputs.run == 'true'
            uses: ./.github/actions/setup-uv
            with:
              version: '0.10.11'
      # yarn 1.22.21 introduced a Corepack bug when running tests.
      # this can be removed once https://github.com/yarnpkg/yarn/issues/9015 is resolved
      - name: install yarn@1.22.19
        if: steps.affected.outputs.run == 'true'
        run: npm i -g yarn@1.22.19
      - name: install pnpm@10.29.3
        if: steps.affected.outputs.run == 'true'
        run: npm i -g pnpm@10.29.3
      - run: pnpm install
        if: steps.affected.outputs.run == 'true'
      - name: Run affected unit tests
        if: steps.affected.outputs.run == 'true'
        timeout-minutes: 65
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          TURBO_EXPERIMENTAL_OTEL_ENDPOINT: ${{ secrets.TURBO_EXPERIMENTAL_OTEL_ENDPOINT }}
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          FORCE_COLOR: '1'
          DD_CIVISIBILITY_AGENTLESS_ENABLED: 'true'
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY_CLI }}
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY_CLI }}
          DD_ENV: ci
          DD_SERVICE: vercel-cli
          DD_PROFILING_ENABLED: 'false'
          DD_NATIVE_METRICS: 'false'
        run: |
          export NODE_OPTIONS="--require=${GITHUB_WORKSPACE}/utils/dd-trace-ci-init.js"
          if [ -n "$TURBO_EXPERIMENTAL_OTEL_ENDPOINT" ]; then
            export TURBO_EXPERIMENTAL_OTEL_HEADERS="Authorization=Bearer ${TURBO_TOKEN}"
          fi

          turbo run test-unit --affected --filter=!vercel --summarize --cache-dir='.turbo' --log-order=stream --continue=always --concurrency=${{ matrix.concurrency }}

  cli-unit-test:
    name: CLI Unit / ${{ matrix.runner }}/node${{ matrix.nodeVersion }} / ${{ matrix.shard }}/7
    needs: setup
    timeout-minutes: 120
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-14, windows-latest]
        nodeVersion: [20, 22]
        shard: [1, 2, 3, 4, 5, 6, 7]
        exclude:
          - runner: windows-latest
            nodeVersion: 20
    env:
      TURBO_SCM_BASE: ${{ needs.setup.outputs.baseSha }}
      TURBO_SCM_HEAD: ${{ needs.setup.outputs.headSha }}
      NODE_VERSION: ${{ matrix.nodeVersion }}
      VITEST_SHARD: ${{ matrix.shard }}/7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.headSha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodeVersion }}
      - name: install turbo@2.10.8
        run: npm i -g turbo@2.10.8
      - name: Check for affected CLI unit tests
        id: affected
        run: |
          set -euo pipefail
          node utils/gen.js
          count=$(turbo run test-unit --affected --filter=vercel --dry=json | jq '[.tasks[] | select(.task == "test-unit" and .command != "<NONEXISTENT>")] | length')
          if [ "$count" -gt 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No affected CLI unit-test task."
          fi
      - parallel:
          - name: Setup Turborepo Remote Cache
            if: steps.affected.outputs.run == 'true'
            uses: ./.github/actions/setup-turborepo-remote-cache
            with:
              team: ${{ vars.TURBO_TEAM }}
          - name: Setup Go toolchain
            if: steps.affected.outputs.run == 'true'
            uses: ./.github/actions/setup-go
            with:
              go-version: '1.23.12'
              cache: false
          - name: Setup Rust toolchain
            if: steps.affected.outputs.run == 'true'
            uses: ./.github/actions/setup-rust
            with:
              toolchain: '1.96.1'
              targets: wasm32-wasip2
          - name: install uv@0.10.11
            if: steps.affected.outputs.run == 'true'
            uses: ./.github/actions/setup-uv
            with:
              version: '0.10.11'
      - name: install yarn@1.22.19
        if: steps.affected.outputs.run == 'true'
        run: npm i -g yarn@1.22.19
      - name: install pnpm@10.29.3
        if: steps.affected.outputs.run == 'true'
        run: npm i -g pnpm@10.29.3
      - run: pnpm install
        if: steps.affected.outputs.run == 'true'
      - name: Run affected CLI unit tests
        if: steps.affected.outputs.run == 'true'
        timeout-minutes: 65
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          TURBO_EXPERIMENTAL_OTEL_ENDPOINT: ${{ secrets.TURBO_EXPERIMENTAL_OTEL_ENDPOINT }}
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          FORCE_COLOR: '1'
          DD_CIVISIBILITY_AGENTLESS_ENABLED: 'true'
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY_CLI }}
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY_CLI }}
          DD_ENV: ci
          DD_SERVICE: vercel-cli
          DD_PROFILING_ENABLED: 'false'
          DD_NATIVE_METRICS: 'false'
        run: |
          attempt=1
          max_attempts=2
          export NODE_OPTIONS="--require=${GITHUB_WORKSPACE}/utils/dd-trace-ci-init.js"
          if [ -n "$TURBO_EXPERIMENTAL_OTEL_ENDPOINT" ]; then
            export TURBO_EXPERIMENTAL_OTEL_HEADERS="Authorization=Bearer ${TURBO_TOKEN}"
          fi

          while [ "$attempt" -le "$max_attempts" ]; do
            if turbo run test-unit --affected --filter=vercel; then
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Tests failed after $max_attempts attempts."
              exit 1
            fi

            echo "Tests failed; retrying once."
            attempt=$((attempt + 1))
          done

  e2e-artifacts:
    name: Resolve E2E Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ needs.setup.outputs['e2e-tests'] != '[]' }}
    needs:
      - setup
    permissions:
      contents: read
      deployments: read
      statuses: read
    outputs:
      deploymentUrl: ${{ steps.resolve.outputs.deploymentUrl }}
      cliVersion: ${{ steps.resolve.outputs.cliVersion }}
    steps:
      - name: Wait for deployment tarballs
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.setup.outputs.headSha }}
        run: |
          set -euo pipefail

          # E2E needs the CLI and Python wheel tarballs produced by the Vercel
          # preview deployment. Resolve them once before the E2E matrix starts
          # so every shard uses the same deployment without duplicating API calls.
          validate_deployment_url() {
            local url="${1%/}"
            if [ -z "$url" ]; then
              return 1
            fi

            if curl --connect-timeout 5 --max-time 15 -fsI "$url/tarballs/vercel.tgz" >/dev/null; then
              echo "deploymentUrl=$url" >> "$GITHUB_OUTPUT"
              echo "cliVersion=$url/tarballs/vercel.tgz" >> "$GITHUB_OUTPUT"
              echo "Deployment tarball is ready at $url/tarballs/vercel.tgz"
              return 0
            fi

            return 1
          }

          get_candidate_urls() {
            local deployment_ids
            deployment_ids="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${HEAD_SHA}&per_page=20" --jq '.[].id')" || return 1

            while IFS= read -r deployment_id; do
              if [ -n "$deployment_id" ]; then
                gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                  --jq '.[] | select(.state == "success" and .environment_url != null and .environment_url != "") | .environment_url' || return 1
              fi
            done <<< "$deployment_ids"

            gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" \
              --jq '.statuses[] | select(.state == "success" and .target_url != null and .target_url != "") | .target_url'
          }

          api_failures=0
          for attempt in {1..120}; do
            if ! candidate_urls="$(get_candidate_urls)"; then
              api_failures=$((api_failures + 1))
              echo "Failed to query deployment URLs (attempt $api_failures/3)."
              if [ "$api_failures" -eq 3 ]; then
                exit 1
              fi
              sleep 10
              continue
            fi
            api_failures=0

            while IFS= read -r candidate_url; do
              if validate_deployment_url "$candidate_url"; then
                exit 0
              fi
            done < <(printf '%s\n' "$candidate_urls" | sort -u)

            echo "Deployment tarball is not ready yet (attempt $attempt/120)."
            sleep 10
          done

          echo "Timed out waiting for deployment tarball."
          exit 1

  e2e-test:
    timeout-minutes: 120
    runs-on: ${{ matrix.runner }}
    name: E2E / ${{ matrix.label }}
    permissions:
      contents: read
      deployments: read
      id-token: write
      statuses: read
    if: ${{ needs.setup.outputs['e2e-tests'] != '[]' }}
    needs:
      - setup
      - e2e-artifacts
    env:
      DPL_URL: ${{ needs.e2e-artifacts.outputs.deploymentUrl }}
      VERCEL_CLI_VERSION: ${{ needs.e2e-artifacts.outputs.cliVersion }}
    strategy:
      fail-fast: false
      max-parallel: 75
      matrix:
        include: ${{ fromJson(needs.setup.outputs['e2e-tests']) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.headSha }}
      - parallel:
          - name: Setup Turborepo Remote Cache
            uses: ./.github/actions/setup-turborepo-remote-cache
            with:
              team: ${{ vars.TURBO_TEAM }}
          - uses: ./.github/actions/setup-node
            with:
              node-version: ${{ matrix.nodeVersion }}
          - name: Setup Go toolchain
            if: ${{ matrix.needsGo == true }}
            uses: ./.github/actions/setup-go
            with:
              go-version: '1.23.12'
              cache: false
          - name: Setup Rust toolchain
            if: ${{ matrix.needsRust == true }}
            uses: ./.github/actions/setup-rust
            with:
              toolchain: '1.96.1'
              targets: wasm32-wasip2
          - name: Install uv
            uses: ./.github/actions/setup-uv
            with:
              version: '0.10.11'
      # yarn 1.22.21 introduced a Corepack bug when running tests.
      # this can be removed once https://github.com/yarnpkg/yarn/issues/9015 is resolved
      - name: install yarn@1.22.19
        run: npm i -g yarn@1.22.19

      - name: install pnpm@10.29.3
        run: npm i -g pnpm@10.29.3

      - name: Install Ruby + Bundler
        if: ${{ matrix.packageName == 'vercel' }}
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          ruby-version: '3.3'

      - parallel:
          - name: Install dependencies
            run: pnpm install

      - name: Resolve Python wheel URLs
        shell: bash
        run: |
          DEPLOYMENT_URL="$DPL_URL"

          PACKAGES_JSON="$(node utils/get-python-packages.js)"
          if [ -z "$PACKAGES_JSON" ] || [ "$PACKAGES_JSON" = "[]" ]; then
            echo "No Python packages discovered; skipping wheel URL resolution."
            exit 0
          fi

          echo "$PACKAGES_JSON" | jq -c '.[]' | while IFS= read -r package; do
            package_slug="$(echo "$package" | jq -r '.packageDir')"
            package_name="$(echo "$package" | jq -r '.packageName')"

            wheel_name="$(curl -sf "$DEPLOYMENT_URL/tarballs/$package_slug-wheel.json" | jq -r '.filename' || echo "")"
            if [ -z "$wheel_name" ]; then
              continue
            fi

            env_var="$(printf '%s' "$package_name" | tr -c '[:alnum:]' '_' | tr '[:lower:]' '[:upper:]')_PYTHON"
            echo "$env_var=$package_name @ $DEPLOYMENT_URL/tarballs/$wheel_name" >> "$GITHUB_ENV"
          done
      - name: Test ${{matrix.packageName}}
        timeout-minutes: 35
        run: |
          attempt=1
          max_attempts=2
          export NODE_OPTIONS="--require=${GITHUB_WORKSPACE}/utils/dd-trace-ci-init.js"
          if [ -n "$TURBO_EXPERIMENTAL_OTEL_ENDPOINT" ]; then
            export TURBO_EXPERIMENTAL_OTEL_HEADERS="Authorization=Bearer ${TURBO_TOKEN}"
          fi

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Running tests (attempt $attempt/$max_attempts): ${{matrix.testScript}} ${{matrix.packageName}}"

            if node utils/gen.js && node_modules/.bin/turbo run ${{matrix.testScript}} --summarize --cache-dir=".turbo" --log-order=stream --filter=${{matrix.packageName}} -- ${{ join(matrix.testPaths, ' ') }}; then
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Tests failed after $max_attempts attempts."
              exit 1
            fi

            echo "Tests failed; retrying once..."
            attempt=$((attempt+1))
          done
        shell: bash
        env:
          # Per-package pip install specs (e.g. VERCEL_RUNTIME_PYTHON,
          # VERCEL_WORKERS_PYTHON) are also available here, injected into
          # $GITHUB_ENV by the "Resolve Python wheel URLs" step above.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          TURBO_BASE_SHA: ${{ needs.setup.outputs.baseSha }}
          TURBO_EXPERIMENTAL_OTEL_ENDPOINT: ${{ secrets.TURBO_EXPERIMENTAL_OTEL_ENDPOINT }}
          FORCE_COLOR: '1'
          # Datadog Test Optimization: emit per-test spans correlated to the
          # GitHub Actions job span, replacing the previous post-hoc JUnit
          # upload. See test/lib/deployment/metrics.js for the legacy
          # DATADOG_API_KEY consumer (custom transient-error metrics).
          DD_CIVISIBILITY_AGENTLESS_ENABLED: 'true'
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY_CLI }}
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY_CLI }}
          DD_ENV: ci
          DD_SERVICE: vercel-cli
          DD_PROFILING_ENABLED: 'false'
          DD_NATIVE_METRICS: 'false'

  enforce-changeset:
    name: Enforce Changeset
    runs-on: ubuntu-latest
    if: github.event.pull_request.title != 'Version Packages'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: git fetch origin ${{ github.event.pull_request.head.sha }}:pr-${{ github.event.pull_request.number }}
      - run: git checkout pr-${{ github.event.pull_request.number }}
      - name: install pnpm@10.29.3
        run: npm i -g pnpm@10.29.3
      - run: pnpm install
      # Enforce a changeset file to be present
      - run: pnpm exec changeset status --since=main

  lint:
    name: Lint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    if: github.event.pull_request.title != 'Version Packages'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR commit directly instead of a merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Turborepo Remote Cache
        uses: vercel/setup-turborepo-remote-cache-action@3df3d75a5268bbe2a4ee66048f56f3a86d6e21b7
        with:
          team: ${{ vars.TURBO_TEAM }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install turbo@2.10.8
        run: npm i -g turbo@2.10.8
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.96.1'
          targets: wasm32-wasip2
      - name: install pnpm@10.29.3
        run: npm i -g pnpm@10.29.3
      - run: pnpm install
      - name: Lint, build, and type-check
        run: node utils/gen.js && turbo run lint format:check lint:dependencies build type-check --output-logs=errors-only --summarize --continue
      - name: Ensure clean git workspace
        run: git diff --name-only --exit-code

  lint-actions:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Deliberately run against the merge commit here because GitHub
          # Actions are sourced from it and cannot be overridden.
          ref:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml==6.0.3 zizmor==1.29.0
      - name: Enforce actions/checkout ref
        shell: python
        run: |
          import glob, sys, yaml

          errors = []
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              with open(path) as f:
                  workflow = yaml.safe_load(f)
              if not isinstance(workflow, dict):
                  continue
              triggers = workflow.get(True) or {}  # 'on' parses as True in YAML
              if isinstance(triggers, list):
                  if "pull_request" not in triggers:
                      continue
              elif isinstance(triggers, dict):
                  if "pull_request" not in triggers:
                      continue
              else:
                  continue
              for job_name, job in workflow.get("jobs", {}).items():
                  for i, step in enumerate(job.get("steps") or []):
                      uses = step.get("uses", "")
                      if not uses.startswith("actions/checkout"):
                          continue
                      with_block = step.get("with") or {}
                      if "ref" not in with_block:
                          errors.append(
                              f"  {path}: job '{job_name}', step {i + 1} "
                              f"uses {uses} without a 'ref'"
                          )

          if errors:
              print("actions/checkout steps missing 'ref':")
              print("\n".join(errors))
              sys.exit(1)
          print("All actions/checkout steps have a 'ref' specified.")
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --collect=workflows --color=never .github/workflows/

  summary:
    name: Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - setup
      - unit-test
      - cli-unit-test
      - e2e-artifacts
      - e2e-test
      - enforce-changeset
      - lint
      - lint-actions
    permissions:
      statuses: write
    steps:
      - name: Check All
        id: check-all
        continue-on-error: true
        run: |-
          for status in ${{ join(needs.*.result, ' ') }}
          do
            if [ "$status" != "success" ] && [ "$status" != "skipped" ]
            then
              echo "Some checks failed"
              echo "state=failure" >> $GITHUB_OUTPUT
              exit 1
            fi
          done
          echo "state=success" >> $GITHUB_OUTPUT
      # The `context` here MUST exactly match the one written by the
      # `Post pending Summary status to PR commit` step in the `setup`
      # job above so this final write overwrites that pending row
      # instead of creating a duplicate.
      - name: Report status to PR commit
        if: ${{ always() && needs.setup.outputs.headSha }}
        uses: actions/github-script@v7
        env:
          CHECK_STATE: ${{ steps.check-all.outputs.state }}
        with:
          script: |
            const state = process.env.CHECK_STATE === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.setup.outputs.headSha }}',
              state,
              context: 'Summary',
              target_url: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              description: state === 'success' ? 'All checks passed' : 'Some checks failed',
            });
      - name: Fail the job if Check All failed
        if: ${{ steps.check-all.outcome == 'failure' }}
        run: exit 1
