# Empty table so this fixture is its own workspace root and is not pulled into
# the repo's top-level cargo workspace (mirrors how examples/* stay separate).
[workspace]

[package]
name = "rust-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "main"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
# Path dependency on the local crate so this fixture exercises the in-repo
# `vercel_runtime` (including its `VERCEL_DEV_PORT` support), mirroring how the
# examples/* crates depend on it.
vercel_runtime = { path = "../../../../../../../crates/vercel_runtime" }
