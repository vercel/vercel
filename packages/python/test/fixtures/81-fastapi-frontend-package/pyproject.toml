[project]
name = "app"
version = "0.1.0"
dependencies = [ "fastapi==0.139.0" ]
requires-python = "~=3.12.0"

# The web app lives in a package (backend/), reached via a package-relative
# import. Declaring the entrypoint routes detection to backend/main.py:app.
[tool.vercel]
entrypoint = "backend.main:app"
