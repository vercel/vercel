[project]
name = "celery-subscriber"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "celery>=5.3.0",
    "vercel",
]

# Declares a background worker compiled into a queue-triggered Lambda alongside
# the FastAPI app. Topics are introspected from the Celery app's queues (the
# vercel-celery adapter registers them as "celery-<app name>-<queue>"), so we
# use a wildcard topic filter.
[[tool.vercel.subscribers]]
entrypoint = "worker:app"
topics = ["celery-*"]
